        // الصفحة 5

      // منع تداخل الأغنيتين
      const _nativePlay = HTMLMediaElement.prototype.play;
      window.__activeAudios = new Set();
      HTMLMediaElement.prototype.play = function() {
        window.__activeAudios.forEach(aud => {
          if (aud !== this && !aud.paused) aud.pause();
        });
        window.__activeAudios.add(this);
        return _nativePlay.apply(this, arguments);
      };

      async function loadCustomGift() {
        try {
          const res = await fetch("assets/index-Duhwop06.js");
          let code = await res.text();

          // 1. الكود 2505 والتلميح
          code = code.replace('code:"1122"', 'code:"2505"');
          code = code.replace('"no try 1122"', '"perhaps the sky remembers the day the sun met the moon"');

          // 2. الاسم في الترحيب
          code = code.replace('name:"my love"', 'name:"Oumnia"');

          // 3. تحديث أسماء القوائم والعناوين
          code = code.replace(/label:`Captured[\s\S]*?Memories`/, 'label:`our\\nmemories`');
          code = code.replace(/label:`Virtual[\s\S]*?Flowers`/, 'label:`flowers for\\nOumnia`');
          code = code.replace(/label:`Love[\s\S]*?Letter`/, 'label:`to my little\\nangel`');
          code = code.replace('flowers:{title:"for you"', 'flowers:{title:"flowers for Oumnia"');

          // 4. وضع عبارات الورد الثمانية
          code = code.replace(/poems:\[[\s\S]*?\]/, 'poems:' + JSON.stringify(myPoems));

          // 5. تفاصيل الأغنية الأولى (Iris)
          code = code.replace('songTitle:"our song"', 'songTitle:"ॐnia 🥺"');
          code = code.replace('artist:"for you 🎵"', 'artist:"iris is an angel just like you 🥺🎵"');
          code = code.replace('highlight:"every lyric feels like us 💕"', 'highlight:"And I\'d give up forever to touch you... 💕"');

          // 6. 3 صور فقط للذكريات
          const oldPhotos = 'images:[{src:"/images/memory1.jpg",label:"❤️",tag:"my fav"},{src:"/images/memory2.jpg",label:"❤️",tag:"cute"},{src:"/images/memory3.jpg",label:"❤️",tag:"forever"},{src:"/images/memory4.jpg",label:"❤️",tag:"love"},{src:"/images/memory5.jpg",label:"❤️",tag:"always"},{src:"/images/memory6.jpg",label:"❤️",tag:"mine"},{src:"/images/memory7.jpg",label:"❤️",tag:"us"}]';
          const newPhotos = 'images:[{src:"./memory1.jpg",label:"🥺",tag:"my fav"},{src:"./memory2.jpg",label:"🥹",tag:"forever"},{src:"./memory3.jpg",label:"️🙈",tag:"usssss"}]';
          code = code.replace(oldPhotos, newPhotos);

          // 7. مسارات الصور للأصل
          code = code.replaceAll('/images/', './');

          // 8. مسارات الأغاني داخل مجلد music
          code = code.replace('music:"/music/music.mp3"', 'music:"./music/music2.mp3"');
          code = code.replace('audioSrc:"/music/music.mp3"', 'audioSrc:"./music/music.mp3"');

          // 9. مزامنة أزرار التشغيل
          code = code.replace(
            'a.addEventListener("canplaythrough",()=>s(!0))',
            'a.addEventListener("canplaythrough",()=>s(!0)),a.addEventListener("pause",()=>r(!1)),a.addEventListener("play",()=>r(!0))'
          );
          code = code.replace(
            'd.addEventListener("loadedmetadata",()=>{u(d.duration)})',
            'd.addEventListener("loadedmetadata",()=>{u(d.duration)}),d.addEventListener("pause",()=>s(!1)),d.addEventListener("play",()=>s(!0))'
          );

          // 10. استبدال مكون الرسالة القديم بكتاب الصفحات التفاعلي الجديد
          const customBookComponent = `function _k({back:e}){
            const [p,setP]=P.useState(0);
            const pages=window.__letterPages||[];
            return P.createElement("div",{className:Re.page},
              P.createElement("div",{className:Re.inner},

                P.createElement("div",{className:Re.kittyCakeWrapper},

                ),
                P.createElement("div",{className:"book-container"},
                  P.createElement("div",{
                    className:"book-page-card",
                    key:p,
                    dangerouslySetInnerHTML:{__html:pages[p]||""}
                  }),
                  P.createElement("div",{className:"book-nav-controls"},
                    P.createElement("button",{
                      className:"book-btn",
                      onClick:()=>setP(c=>Math.max(0,c-1)),
                      disabled:p===0
                    },"السابق ⬅️"),
                    P.createElement("span",{className:"book-page-dots"},(p+1)+" / "+pages.length+" 💖"),
                    P.createElement("button",{
                      className:"book-btn",
                      onClick:()=>setP(c=>Math.min(pages.length-1,c+1)),
                      disabled:p===pages.length-1
                    },"التالي ➡️")
                  )
                ),
                P.createElement("div",{className:Re.dashedBottom}),
                P.createElement("div",{className:Re.footer},
                  P.createElement("h2",{className:Re.title,dir:"auto"},"to my little angel"),
                  P.createElement("button",{className:"btn-return",onClick:e},"RETURN")
                )
              )
            );
          }`;

          code = code.replace(/function _k\(\{back:e,content:t\}\)[\s\S]*?const Ck=/, customBookComponent + ';const Ck=');

          // تشغيل الكود المعدل
          const blob = new Blob([code], { type: "text/javascript" });
          const scriptUrl = URL.createObjectURL(blob);
          await import(scriptUrl);
        } catch (err) {
          console.error("Error loading customized bundle:", err);
        }
